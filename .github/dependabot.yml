version: 2
updates:
  # Maintain npm dependencies (for packages and web apps)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Optional: Group minor and patch updates together to avoid spamming pull requests
    groups:
      default:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Maintain GitHub Actions workflow versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
